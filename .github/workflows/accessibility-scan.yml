name: ♿ Accessibility Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  accessibility:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm ci
          npm install -g pa11y pa11y-ci @lhci/cli http-server
          pip3 install html5validator

      # -------------------------------
      # Start Local Server
      # -------------------------------
      - name: Create Test Index Page
        run: |
          # Create a simple index.html for testing if it doesn't exist
          if [ ! -f "index.html" ]; then
            cat > index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Accessibility Test Page</title>
          </head>
          <body>
              <h1>Accessibility Test Page</h1>
              <p>This is a temporary page for accessibility testing.</p>
              <nav>
                  <ul>
                      <li><a href="404.html">404 Page</a></li>
                      <li><a href="footer-test.html">Footer Test</a></li>
                  </ul>
              </nav>
              <main>
                  <section>
                      <h2>Test Content</h2>
                      <p>This content is used for accessibility scanning.</p>
                      <button type="button">Test Button</button>
                  </section>
              </main>
          </body>
          </html>
          EOF
          fi

      - name: Start Local Server
        run: |
          npx http-server . -p 8080 --cors &
          sleep 15
          
          # Test server with multiple attempts
          for i in {1..5}; do
            if curl -f -s http://localhost:8080 > /dev/null; then
              echo "Server is running successfully"
              break
            else
              echo "Attempt $i: Server not ready, waiting..."
              sleep 5
            fi
          done
          
          # Final check
          if ! curl -f http://localhost:8080 > /dev/null 2>&1; then
            echo "Server failed to start properly"
            netstat -tlnp | grep 8080 || echo "Port 8080 not in use"
            ps aux | grep http-server || echo "No http-server process found"
            exit 1
          fi

      # -------------------------------
      # HTML5 Validation
      # -------------------------------
      - name: HTML5 Validation
        run: |
          html5validator --root . --also-check-css --format json --output html5-validation-report.json || true

      - name: Upload HTML5 Validation Report
        uses: actions/upload-artifact@v4
        with:
          name: html5-validation-report
          path: html5-validation-report.json

      # -------------------------------
      # Pa11y Accessibility Testing
      # -------------------------------
      - name: Run Pa11y Accessibility Tests
        run: |
          echo "Testing main pages for accessibility..."
          pa11y http://localhost:8080 \
            --standard WCAG2AA \
            --reporter json \
            --timeout 30000 \
            --ignore "color-contrast" > pa11y-home-report.json || true
          
          # Test other key pages if they exist
          for page in "404.html" "footer-test.html"; do
            if [ -f "$page" ]; then
              echo "Testing $page..."
              pa11y "http://localhost:8080/$page" \
                --standard WCAG2AA \
                --reporter json \
                --timeout 30000 \
                --ignore "color-contrast" > "pa11y-$(basename $page .html)-report.json" || true
            fi
          done

      - name: Upload Pa11y Reports
        uses: actions/upload-artifact@v4
        with:
          name: pa11y-accessibility-reports
          path: pa11y-*-report.json

      # -------------------------------
      # Lighthouse CI Accessibility Audit
      # -------------------------------
      - name: Create Lighthouse CI Config
        run: |
          cat > .lighthouserc.json << 'EOF'
          {
            "ci": {
              "collect": {
                "url": ["http://localhost:8080"],
                "settings": {
                  "chromeFlags": "--no-sandbox --headless --disable-gpu",
                  "preset": "desktop"
                }
              },
              "assert": {
                "assertions": {
                  "categories:accessibility": ["error", {"minScore": 0.9}],
                  "categories:best-practices": ["error", {"minScore": 0.8}],
                  "categories:seo": ["error", {"minScore": 0.8}]
                }
              },
              "upload": {
                "target": "temporary-public-storage"
              }
            }
          }
          EOF

      - name: Run Lighthouse CI
        run: |
          lhci autorun --upload.target=temporary-public-storage || true

      - name: Save Lighthouse Results
        run: |
          if [ -d ".lighthouseci" ]; then
            cp -r .lighthouseci lighthouse-results
          fi

      - name: Upload Lighthouse Results
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: lighthouse-results/
        if: always()

      # -------------------------------
      # axe-core Accessibility Testing
      # -------------------------------
      - name: Install axe-core CLI
        run: npm install -g @axe-core/cli

      - name: Run axe-core Tests
        run: |
          axe http://localhost:8080 \
            --tags wcag2a,wcag2aa,wcag21aa \
            --reporter json \
            --output axe-report.json || true

      - name: Upload axe-core Report
        uses: actions/upload-artifact@v4
        with:
          name: axe-accessibility-report
          path: axe-report.json

      # -------------------------------
      # Generate Summary Report
      # -------------------------------
      - name: Generate Accessibility Summary
        run: |
          echo "# 🏁 Accessibility Scan Summary" > accessibility-summary.md
          echo "" >> accessibility-summary.md
          echo "## 📊 Test Results" >> accessibility-summary.md
          echo "" >> accessibility-summary.md
          
          # HTML5 Validation Summary
          if [ -f "html5-validation-report.json" ]; then
            echo "### HTML5 Validation" >> accessibility-summary.md
            echo "✅ HTML5 validation completed" >> accessibility-summary.md
            echo "" >> accessibility-summary.md
          fi
          
          # Pa11y Summary
          if ls pa11y-*-report.json 1> /dev/null 2>&1; then
            echo "### Pa11y WCAG2AA Testing" >> accessibility-summary.md
            echo "✅ Pa11y accessibility tests completed" >> accessibility-summary.md
            echo "" >> accessibility-summary.md
          fi
          
          # Lighthouse Summary
          if [ -d "lighthouse-results" ]; then
            echo "### Lighthouse Audit" >> accessibility-summary.md
            echo "✅ Lighthouse accessibility audit completed" >> accessibility-summary.md
            echo "" >> accessibility-summary.md
          fi
          
          # axe-core Summary
          if [ -f "axe-report.json" ]; then
            echo "### axe-core Testing" >> accessibility-summary.md
            echo "✅ axe-core accessibility tests completed" >> accessibility-summary.md
            echo "" >> accessibility-summary.md
          fi
          
          echo "## 📋 Next Steps" >> accessibility-summary.md
          echo "1. Review uploaded artifacts for detailed reports" >> accessibility-summary.md
          echo "2. Fix any critical accessibility issues found" >> accessibility-summary.md
          echo "3. Test with actual screen readers for comprehensive validation" >> accessibility-summary.md

      - name: Upload Accessibility Summary
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-summary
          path: accessibility-summary.md

      # -------------------------------
      # Cleanup
      # -------------------------------
      - name: Stop Local Server
        run: pkill -f "http-server" || true
        if: always()
